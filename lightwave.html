<!doctype html>
<html><head><meta charset="utf-8"><title>LightWave 3D Layout</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#202020;font-family:"Courier New",monospace;overflow:hidden;height:100vh}
#wrap{position:relative;margin:0 auto}
#app{transform-origin:0 0;position:absolute;left:0;top:0}
#app{width:900px;height:660px;background:#7a7a7a;position:relative;border:2px solid #000;user-select:none;overflow:hidden}
.btn{background:#9a9a9a;border:2px outset #c8c8c8;color:#000;font:bold 12px "Courier New",monospace;text-align:center;line-height:15px;height:19px;cursor:pointer;white-space:nowrap;overflow:hidden}
.btn:active{border-style:inset}.btn.on{background:#e0c870}
.lbl{position:absolute;color:#2a2a2a;font:bold 12px "Courier New",monospace;text-align:center;white-space:nowrap}
.sep{position:absolute;height:3px;border-top:2px solid #555;border-bottom:1px solid #aaa}
#view{position:absolute;left:220px;top:38px;border:2px inset #999;cursor:crosshair}
.field{position:absolute;background:#5c5c5c;border:2px inset #999;color:#fff;font:bold 12px "Courier New",monospace;height:19px;line-height:15px;padding:0 4px;white-space:pre;overflow:hidden}
input,select{font:bold 12px "Courier New",monospace;background:#5c5c5c;color:#fff;border:2px inset #999;height:21px;padding:0 3px}
input[type=color]{padding:0;width:60px}
input[type=range]{accent-color:#e0c870;padding:0;background:transparent;border:0}
.req,#rwin{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
.req{z-index:40}#rwin{z-index:30;display:none}
.win{background:#8a8a8a;border:2px outset #ccc;min-width:min(340px,95vw);max-width:95vw;box-shadow:4px 4px 0 #0008}
.wt{background:#4a4a4a;color:#fff;font:bold 12px "Courier New",monospace;padding:3px 8px;text-align:center;cursor:move}
.wb{padding:8px 10px;font:bold 12px "Courier New",monospace;color:#111;max-height:72vh;overflow:auto}
.wf{padding:6px 10px;text-align:right;border-top:1px solid #aaa}
.wf .btn,.wb .btn,#rbox .btn{display:inline-block;padding:0 10px;margin:2px}
.r{display:flex;align-items:center;margin:3px 0;gap:6px}.r label{width:160px;text-align:right}
.note{font-weight:normal;margin:4px 0;white-space:pre-wrap}
.menu{position:fixed;z-index:50;background:#9a9a9a;border:2px outset #ccc;font:bold 12px "Courier New",monospace;min-width:190px;padding:2px 0;box-shadow:3px 3px 0 #0008;max-height:90vh;overflow:auto}
.mi{padding:2px 12px;cursor:pointer;white-space:pre}.mi:hover{background:#e0c870}.mi.dis{color:#555;pointer-events:none}
.mh{padding:2px 12px;color:#fff;background:#5a5a5a}.ms{border-top:1px solid #555;border-bottom:1px solid #bbb;margin:2px 0}
#rbox{max-width:96vw;background:#7a7a7a;border:2px outset #ccc;padding:8px;font:bold 12px "Courier New",monospace}
#rbox canvas{display:block;border:2px inset #999;background:#000;image-rendering:pixelated;width:min(640px,92vw);max-height:70vh;object-fit:contain}
#pbar{height:14px;background:#5a5a5a;border:2px inset #999;margin:6px 0}#pfill{height:100%;background:#e0c870;width:0}
</style></head><body>
<div id="wrap"><div id="app"></div></div>
<div id="rwin"><div id="rbox">
 <div id="rstat">Rendering</div>
 <div id="pbar"><div id="pfill"></div></div>
 <canvas id="rc" width="640" height="400"></canvas>
 <div style="margin-top:6px"><span class="btn" id="rabort">Abort</span><span class="btn" id="rclose">Close</span><span class="btn" id="rsave">Save RGB</span><span class="btn" id="rplay">Play</span></div>
</div></div>
<script id="core">
// ================= math =================
const V=(x,y,z)=>({x,y,z}),add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z),sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z),
mul=(a,s)=>V(a.x*s,a.y*s,a.z*s),dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,
cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x),len=a=>Math.sqrt(dot(a,a)),norm=a=>mul(a,1/len(a)),
cm=(a,b)=>V(a.x*b.x,a.y*b.y,a.z*b.z),refl=(d,n)=>sub(d,mul(n,2*dot(d,n))),clamp=(v,a,b)=>v<a?a:v>b?b:v,AX=['x','y','z'];
function rotY(v,a){const c=Math.cos(a),s=Math.sin(a);return V(v.x*c+v.z*s,v.y,-v.x*s+v.z*c)}
const hex2v=h=>V(parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255);
const v2hex=c=>'#'+[c.x,c.y,c.z].map(t=>Math.round(clamp(t,0,1)*255).toString(16).padStart(2,'0')).join('');
const cp=o=>JSON.parse(JSON.stringify(o)),$=id=>document.getElementById(id),DEG=180/Math.PI;
const COL={x:'#ff6060',y:'#60ff60',z:'#6090ff'};

// ================= scene =================
function mat(name,col,o){return Object.assign({name,col,col2:V(.1,.1,.1),tex:'none',texScale:4,diff:.8,spec:.5,pow:50,refl:0,trans:0,ior:1.5,metal:false},o)}
function obj(name,type,p,r,m,rot=0){return{name,type,p,r,rot,mat:m,keys:[],home:{p:{...p},r,rot}}}
function defaultScene(){
 const objs=[obj('GlassBall','sphere',V(0,1,0),1,'glass'),obj('ChromeBall','sphere',V(-2.3,.8,1.2),.8,'chrome'),
  obj('RedBall','sphere',V(2.2,.7,1.5),.7,'plastic'),obj('GoldCube','box',V(1.6,.6,-1.6),.6,'gold',.5),
  obj('MarbleCube','box',V(-1.4,.5,-2),.5,'marble',-.3),obj('RubyBall','sphere',V(.6,.35,2.3),.35,'ruby')];
 objs[2].keys=[{f:1,s:{x:2.2,y:.7,z:1.5,rot:0,r:.7}},{f:15,s:{x:2.6,y:2.2,z:.8,rot:0,r:.7}},{f:30,s:{x:2.2,y:.7,z:1.5,rot:0,r:.7}}];
 return{name:'Untitled',
 M:{glass:mat('Glass',V(.97,1,.98),{diff:0,spec:.9,pow:250,trans:1,ior:1.5}),
  chrome:mat('Chrome',V(.9,.9,.95),{diff:.05,spec:1,pow:300,refl:.85}),
  plastic:mat('RedPlastic',V(.85,.1,.08),{diff:.85,spec:.6,pow:60,refl:.08}),
  gold:mat('Gold',V(1,.75,.3),{diff:.35,spec:.9,pow:80,refl:.55,metal:true}),
  matte:mat('BlueMatte',V(.2,.35,.9),{diff:.9,spec:.05,pow:5}),
  marble:mat('Marble',V(.95,.93,.9),{col2:V(.25,.25,.32),tex:'marble',texScale:2,spec:.5,pow:80,refl:.1}),
  ruby:mat('RubyGlass',V(1,.25,.3),{diff:0,spec:.9,pow:250,trans:.9,ior:1.6,refl:.05}),
  stripes:mat('Candy',V(.95,.95,.95),{col2:V(.8,.1,.2),tex:'stripes',texScale:3,spec:.7,pow:90,refl:.1}),
  floor:mat('Checker',V(.92,.92,.88),{col2:V(.08,.08,.1),tex:'checker',texScale:1,diff:.9,spec:.3,pow:40,refl:.2})},
 objs,
 light:{p:V(-4,7,5),col:V(1,.98,.92),int:1,amb:.12,shadows:true,soft:false,rad:.5,keys:[]},
 cam:{t:V(0,.8,0),yaw:.35,pitch:.32,dist:8,zoom:2.2,keys:[]},
 first:1,last:30,fps:15,frame:1,depth:6,aa:2,resW:640,resH:400,
 fog:true,fogMin:25,fogMax:80,skyTop:V(.15,.25,.55),skyHor:V(.55,.6,.7),flare:false,
 grid:2,snap:false,shadeView:false,autoKey:true};
}
let S=defaultScene();
const VCAM0={t:V(0,.8,0),yaw:.6,pitch:.45,dist:12,zoom:2.2};
let vcam=cp(VCAM0),sel=0,editMode='object',viewMode='persp',mouseMode='move',axOn={x:1,y:1,z:1},bgImg=null;
const RT={depth:6,soft:false,bg:null,fog:true,px:0,py:0};

// ================= ray tracing =================
function hitSphere(o,ro,rd){const oc=sub(ro,o.p),b=dot(oc,rd),c=dot(oc,oc)-o.r*o.r,h=b*b-c;if(h<0)return -1;
 const s=Math.sqrt(h);let t=-b-s;if(t>1e-4)return t;t=-b+s;return t>1e-4?t:-1}
function hitBox(o,ro,rd){const lo=rotY(sub(ro,o.p),-o.rot),ld=rotY(rd,-o.rot),r=o.r;let tn=-1e30,tf=1e30;
 for(const k of AX){if(Math.abs(ld[k])<1e-12){if(lo[k]<-r||lo[k]>r)return -1;continue}
  const inv=1/ld[k];let t1=(-r-lo[k])*inv,t2=(r-lo[k])*inv;if(t1>t2){const t=t1;t1=t2;t2=t}
  if(t1>tn)tn=t1;if(t2<tf)tf=t2;if(tn>tf)return -1}
 if(tf<1e-4)return -1;return tn>1e-4?tn:tf}
const hitObj=(o,ro,rd)=>o.type==='sphere'?hitSphere(o,ro,rd):hitBox(o,ro,rd);
function normalAt(o,p){if(o.type==='sphere')return norm(sub(p,o.p));
 const d=rotY(sub(p,o.p),-o.rot),a=V(Math.abs(d.x),Math.abs(d.y),Math.abs(d.z));let n;
 if(a.x>a.y&&a.x>a.z)n=V(Math.sign(d.x),0,0);else if(a.y>a.z)n=V(0,Math.sign(d.y),0);else n=V(0,0,Math.sign(d.z));return rotY(n,o.rot)}
function trace(ro,rd){let best=1e9,ho=null;
 for(const o of S.objs){const t=hitObj(o,ro,rd);if(t>0&&t<best){best=t;ho=o}}
 if(rd.y<-1e-6){const t=-ro.y/rd.y;if(t>1e-4&&t<best){best=t;ho='floor'}}
 return ho?{t:best,o:ho}:null}
function sky(rd){if(rd.y<0)return mul(S.skyHor,.85);const t=Math.pow(rd.y,.6);return add(mul(S.skyHor,1-t),mul(S.skyTop,t))}
function noise(p){return Math.sin(p.x*1.3+Math.sin(p.y*2.1+p.z*.7))*Math.cos(p.z*1.7+Math.sin(p.x*2.9))+.5*Math.sin(p.y*3.1+p.x*1.1)*Math.cos(p.z*2.3)}
function texCol(m,lp){const s=m.texScale;switch(m.tex){
 case'checker':return((Math.floor(lp.x*s+1e-4)+Math.floor(lp.y*s+1e-4)+Math.floor(lp.z*s+1e-4))&1)?m.col2:m.col;
 case'stripes':return Math.sin(lp.y*s*Math.PI*2)>0?m.col2:m.col;
 case'marble':{const q=mul(lp,s),t=.5+.5*Math.sin(q.x*3+q.y*2+3*noise(q)+1.5*noise(mul(q,2.3)));return add(mul(m.col,t),mul(m.col2,1-t))}
 default:return m.col}}
function shadowAt(p){const L0=S.light,n=RT.soft?4:1;let tot=0;
 for(let i=0;i<n;i++){let lp=L0.p;if(RT.soft){const r=L0.rad*2;lp=add(lp,V((Math.random()-.5)*r,(Math.random()-.5)*r,(Math.random()-.5)*r))}
  const L=sub(lp,p),d=len(L),ld=mul(L,1/d);let att=1;
  for(const o of S.objs){const t=hitObj(o,p,ld);if(t>0&&t<d){att*=S.M[o.mat].trans*.8;if(att<=0)break}}
  tot+=att}
 return tot/n}
function shade(ro,rd,depth){
 const h=trace(ro,rd);
 if(!h)return(depth===0&&RT.bg)?RT.bg():sky(rd);
 const p=add(ro,mul(rd,h.t));let n,m,lp;
 if(h.o==='floor'){n=V(0,1,0);m=S.M.floor;lp=V(p.x,.001,p.z)}
 else{m=S.M[h.o.mat];n=normalAt(h.o,p);lp=rotY(sub(p,h.o.p),-h.o.rot)}
 let c=surface(p,n,rd,m,texCol(m,lp),depth);
 if(RT.fog&&S.fog){const f=clamp((h.t-S.fogMin)/Math.max(.01,S.fogMax-S.fogMin),0,1);if(f>0)c=add(mul(c,1-f),mul(sky(rd),f))}
 return c}
function surface(p,n,rd,m,base,depth){
 const into=dot(rd,n)<0,nn=into?n:mul(n,-1),L=S.light,Lc=mul(L.col,L.int),ld=norm(sub(L.p,p));
 const sh=L.shadows?shadowAt(add(p,mul(nn,1e-3))):1;
 const diff=Math.max(0,dot(nn,ld))*sh,hv=norm(sub(ld,rd)),sp=m.spec*Math.pow(Math.max(0,dot(nn,hv)),m.pow)*sh;
 let c=cm(base,add(V(L.amb,L.amb,L.amb),mul(Lc,m.diff*diff)));
 if(m.refl>0&&depth<RT.depth){const r=shade(add(p,mul(nn,1e-3)),refl(rd,nn),depth+1);c=add(mul(c,1-m.refl),mul(m.metal?cm(r,base):r,m.refl))}
 if(m.trans>0){let gl;
  if(depth<RT.depth){const eta=into?1/m.ior:m.ior,cosi=-dot(rd,nn),k=1-eta*eta*(1-cosi*cosi);
   const r0=((1-m.ior)/(1+m.ior))**2,fr=r0+(1-r0)*Math.pow(1-cosi,5);
   const rcol=shade(add(p,mul(nn,1e-3)),refl(rd,nn),depth+1);
   if(k<0)gl=rcol;else{const td=norm(add(mul(rd,eta),mul(nn,eta*cosi-Math.sqrt(k))));
    gl=add(mul(rcol,fr),mul(cm(shade(sub(p,mul(nn,1e-3)),td,depth+1),base),1-fr))}
  }else gl=cm(sky(rd),base);
  c=add(mul(c,1-m.trans),mul(gl,m.trans))}
 return add(c,cm(m.metal?base:V(1,1,1),mul(Lc,sp)))}
const gam=v=>Math.min(255,Math.pow(Math.max(0,v),1/1.8)*255);

</script><script>
// ================= cameras / views =================
function lookB(pos,tgt,ht){const f=norm(sub(tgt,pos));let r=cross(f,V(0,1,0));r=len(r)<1e-6?V(1,0,0):norm(r);return{pos,f,r,u:cross(r,f),ht}}
function orbitBasis(c,ht){const k=Math.cos(c.pitch);
 return lookB(add(c.t,V(Math.sin(c.yaw)*k*c.dist,Math.sin(c.pitch)*c.dist,Math.cos(c.yaw)*k*c.dist)),c.t,ht||1/c.zoom)}
const VW=660,VH=440;let VB,VS;
function viewBasis(){
 if(viewMode==='persp')return orbitBasis(vcam);
 if(viewMode==='camera'){const ar=S.resW/S.resH,av=VW/VH;return orbitBasis(S.cam,ar>av?(1/S.cam.zoom)*ar/av:1/S.cam.zoom)}
 if(viewMode==='light')return lookB(S.light.p,S.cam.t,.75);
 return{ortho:viewMode,t:vcam.t,sc:VH/(vcam.dist*1.4)}}
function setVB(){VB=viewBasis();VS=VB.ortho?0:VH/2/VB.ht}
const toCam=p=>{const d=sub(p,VB.pos);return V(dot(d,VB.r),dot(d,VB.u),dot(d,VB.f))};
function project(p){
 if(VB.ortho){const s=VB.sc,c=VB.t;
  if(VB.ortho==='xy')return{x:VW/2+(p.x-c.x)*s,y:VH/2-(p.y-c.y)*s};
  if(VB.ortho==='xz')return{x:VW/2+(p.x-c.x)*s,y:VH/2+(p.z-c.z)*s};
  return{x:VW/2+(p.z-c.z)*s,y:VH/2-(p.y-c.y)*s}}
 const c=toCam(p);if(c.z<.05)return null;return{x:VW/2+c.x*VS/c.z,y:VH/2-c.y*VS/c.z}}
function viewRay(mx,my){
 if(VB.ortho){const s=VB.sc,c=VB.t,a=(mx-VW/2)/s,b=(my-VH/2)/s;
  if(VB.ortho==='xy')return{ro:V(c.x+a,c.y-b,c.z+100),rd:V(0,0,-1)};
  if(VB.ortho==='xz')return{ro:V(c.x+a,c.y+100,c.z+b),rd:V(0,-1,0)};
  return{ro:V(c.x-100,c.y-b,c.z+a),rd:V(1,0,0)}}
 return{ro:VB.pos,rd:norm(add(VB.f,add(mul(VB.r,(mx-VW/2)/VS),mul(VB.u,(VH/2-my)/VS))))}}
function groundAt(m,y){const{ro,rd}=viewRay(m.x,m.y);if(Math.abs(rd.y)<1e-4)return null;const t=(y-ro.y)/rd.y;return t<0||t>500?null:add(ro,mul(rd,t))}

// ================= items & keyframes =================
function curItem(){
 if(editMode==='object')return S.objs[sel]?{k:'obj',o:S.objs[sel]}:null;
 if(editMode==='light')return{k:'light',o:S.light};
 if(editMode==='camera')return{k:'cam',o:S.cam};
 return{k:'view',o:vcam}}
const itemName=it=>it.k==='obj'?it.o.name:it.k==='light'?'Light':it.k==='cam'?'Camera':'(view)';
const itemPos=it=>it.k==='cam'?orbitBasis(it.o).pos:it.k==='view'?it.o.t:it.o.p;
function stateOf(it){const o=it.o;
 if(it.k==='obj')return{x:o.p.x,y:o.p.y,z:o.p.z,rot:o.rot,r:o.r};
 if(it.k==='light')return{x:o.p.x,y:o.p.y,z:o.p.z};
 return{x:o.t.x,y:o.t.y,z:o.t.z,yaw:o.yaw,pitch:o.pitch,dist:o.dist}}
function applyState(it,s){const o=it.o;
 if(it.k==='cam'||it.k==='view'){o.t=V(s.x,s.y,s.z);o.yaw=s.yaw;o.pitch=s.pitch;o.dist=s.dist}
 else{o.p=V(s.x,s.y,s.z);if(it.k==='obj'){o.rot=s.rot;o.r=s.r}}}
const CR=(a,b,c,d,t)=>.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t);
function interp(keys,f){if(!keys||!keys.length)return null;const n=keys.length;
 if(f<=keys[0].f)return keys[0].s;if(f>=keys[n-1].f)return keys[n-1].s;
 let i=0;while(keys[i+1].f<=f)i++;const k1=keys[i],k2=keys[i+1],k0=keys[i-1]||k1,k3=keys[i+2]||k2,u=(f-k1.f)/(k2.f-k1.f),r={};
 for(const c in k1.s)r[c]=CR(k0.s[c],k1.s[c],k2.s[c],k3.s[c],u);return r}
const allItems=()=>[...S.objs.map(o=>({k:'obj',o})),{k:'light',o:S.light},{k:'cam',o:S.cam}];
function setFrame(f){S.frame=clamp(Math.round(f),S.first,S.last);
 for(const it of allItems()){const s=interp(it.o.keys,S.frame);if(s){applyState(it,s);if(it.k==='obj')sanitize(it.o)}}syncFrame();draw()}
function setKey(it){if(!it||!it.o.keys)return;const s=stateOf(it),k=it.o.keys,i=k.findIndex(q=>q.f===S.frame);
 if(i>=0)k[i].s=s;else{k.push({f:S.frame,s});k.sort((a,b)=>a.f-b.f)}status(`Key created for ${itemName(it)} at frame ${S.frame}`)}
function delKey(it){if(!it||!it.o.keys)return;const i=it.o.keys.findIndex(q=>q.f===S.frame);
 if(i>=0){it.o.keys.splice(i,1);status(`Key deleted at frame ${S.frame}`)}else status(`No key at frame ${S.frame}`)}
function keyCmd(addK){const it=curItem();if(!it||it.k==='view'){status('Select an object, light or camera');return}addK?setKey(it):delKey(it);draw()}
const countKeys=()=>allItems().reduce((a,it)=>a+it.o.keys.length,0);
function sanitize(o){o.r=Math.max(.05,o.r);if(o.p.y<o.r)o.p.y=o.r}
function moveItem(it,d){if(it.k==='cam'||it.k==='view')it.o.t=add(it.o.t,d);else it.o.p=add(it.o.p,d);if(it.k==='obj')sanitize(it.o)}
function rotItem(it,dx,dy){if(it.k==='obj')it.o.rot+=dx*.01;else if(it.k==='light')it.o.p=rotY(it.o.p,dx*.01);
 else{it.o.yaw-=dx*.01;it.o.pitch=clamp(it.o.pitch+dy*.01,-1.4,1.5)}}
function sizeItem(it,a){if(it.k==='obj'){it.o.r*=Math.exp(a);sanitize(it.o)}else if(it.k==='light')it.o.int=clamp(it.o.int*Math.exp(a),0,5);
 else it.o.dist=clamp(it.o.dist*Math.exp(-a),1,80)}
function afterEdit(it){if(!it||it.k==='view')return;
 if(S.snap&&mouseMode==='move'){const g=S.grid/4,p=it.k==='cam'?it.o.t:it.o.p;for(const k of AX)p[k]=Math.round(p[k]/g)*g;if(it.k==='obj')sanitize(it.o)}
 if(S.autoKey&&it.o.keys.length)setKey(it)}

// ================= undo =================
const undoStack=[];
function pushUndo(){undoStack.push(JSON.stringify({objs:S.objs,light:S.light,cam:S.cam,M:S.M}));if(undoStack.length>60)undoStack.shift()}
function undo(){if(!undoStack.length){status('Nothing to undo');return}Object.assign(S,JSON.parse(undoStack.pop()));sel=Math.min(sel,Math.max(0,S.objs.length-1));status('Undo');draw()}

// ================= object commands =================
function addObj(type,gp,size){pushUndo();const r=size||(type==='sphere'?.5:.4),n=S.objs.filter(o=>o.type===type).length+1;

 S.objs.push(o);sel=S.objs.length-1;setEdit('object');status('Added '+o.name)}

  let mn=1e9,mx=-1e9;sm.forEach(s=>show.forEach(ch=>{mn=Math.min(mn,s[ch]);mx=Math.max(mx,s[ch])}));if(mx-mn<1e-6){mn-=1;mx+=1}const pd=(mx-mn)*.1;mn-=pd;mx+=pd;
  const X=f=>36+(f-S.first)/n*(c.width-46),Y=v=>c.height-18-(v-mn)/(mx-mn)*(c.height-30);
  x.fillStyle='#3a3a3a';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#4c4c4c';x.fillStyle='#bbb';x.font='10px monospace';
  for(let f=S.first;f<=S.last;f+=5){x.beginPath();x.moveTo(X(f),6);x.lineTo(X(f),c.height-18);x.stroke();x.fillText(f,X(f)-4,c.height-5)}
  x.fillText(mx.toFixed(2),2,14);x.fillText(mn.toFixed(2),2,c.height-20);
  x.strokeStyle='#e0c870';x.beginPath();x.moveTo(X(S.frame),6);x.lineTo(X(S.frame),c.height-18);x.stroke();
  show.forEach(ch=>{x.strokeStyle=x.fillStyle=COL[ch]||'#ddd';x.lineWidth=2;x.beginPath();sm.forEach((s,i)=>{const px=X(S.first+i),py=Y(s[ch]);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.lineWidth=1;
   it.o.keys.forEach(k=>{if(k.f>=S.first&&k.f<=S.last)x.fillRect(X(k.f)-3,Y(k.s[ch])-3,7,7)})});
  c.onclick=e=>{const r=c.getBoundingClientRect();setFrame(S.first+(e.clientX-r.left-36)/(c.width-46)*n);R.rebuild()};
  note(b,`Keys at frames: ${it.o.keys.map(k=>k.f).join(', ')||'none'}     Current frame: ${S.frame}   (click graph to set frame)`);
  btnRow(b,[['Create Key',()=>{setKey(it);R.rebuild()}],['Delete Key',()=>{delKey(it);R.rebuild()}],
   ['Prev Key',()=>{const k=[...it.o.keys].reverse().find(k=>k.f<S.frame);if(k){setFrame(k.f);R.rebuild()}}],
   ['Next Key',()=>{const k=it.o.keys.find(k=>k.f>S.frame);if(k){setFrame(k.f);R.rebuild()}}],['Clear All Keys',()=>{it.o.keys=[];R.rebuild()}]])})}

// ================= rendering =================
const rwin=$('rwin'),rc=$('rc'),rg=rc.getContext('2d',{willReadFrequently:true}),pfill=$('pfill'),rstat=$('rstat'),rplay=$('rplay');
let job=0,playI=null,frames=[],fIdx=0;
const nextFrame=()=>new Promise(r=>requestAnimationFrame(r));
function openRW(){rwin.style.display='flex';stopPB();rplay.style.display='none'}
async function renderFrameST(W,H,aa,prog){const id=job;rc.width=W;rc.height=H;rg.fillStyle='#000';rg.fillRect(0,0,W,H);
 const b=orbitBasis(S.cam),asp=W/H,ht=b.ht,img=rg.createImageData(W,1);let bgd=null;
 if(bgImg){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(bgImg.img,0,0,W,H);bgd=x.getImageData(0,0,W,H).data}
 const cfg={depth:S.depth,soft:S.light.soft,fog:true,bg:bgd?()=>{const i=(RT.py*W+RT.px)*4;return V((bgd[i]/255)**1.8,(bgd[i+1]/255)**1.8,(bgd[i+2]/255)**1.8)}:null};
 Object.assign(RT,cfg);let end=performance.now()+30;
 for(let y=0;y<H;y++){
  for(let x=0;x<W;x++){let c=V(0,0,0);RT.px=x;RT.py=y;
   for(let i=0;i<aa;i++)for(let j=0;j<aa;j++){const sx=aa>1?(i+Math.random())/aa:.5,sy=aa>1?(j+Math.random())/aa:.5;
    c=add(c,shade(b.pos,norm(add(b.f,add(mul(b.r,((x+sx)/W*2-1)*ht*asp),mul(b.u,(1-(y+sy)/H*2)*ht)))),0))}
   c=mul(c,1/(aa*aa));const k=x*4;img.data[k]=gam(c.x);img.data[k+1]=gam(c.y);img.data[k+2]=gam(c.z);img.data[k+3]=255}
  rg.putImageData(img,0,y);
  if(performance.now()>end){prog(y+1);await nextFrame();if(id!==job)return false;Object.assign(RT,cfg);end=performance.now()+30}}
 if(S.flare)drawFlare(W,H,b);prog(H);return true}
function drawFlare(W,H,b){const d=sub(S.light.p,b.pos),z=dot(d,b.f);if(z<=0)return;
 const sx=W/2+dot(d,b.r)/z/(b.ht*W/H)*W/2,sy=H/2-dot(d,b.u)/z/b.ht*H/2,Ld=len(d),ld=mul(d,1/Ld);
 for(const o of S.objs){const t=hitObj(o,b.pos,ld);if(t>0&&t<Ld&&S.M[o.mat].trans<.5)return}
 const x=rg;x.save();x.globalCompositeOperation='lighter';const R=W*.14,gr=x.createRadialGradient(sx,sy,0,sx,sy,R);
 gr.addColorStop(0,'rgba(255,255,240,.95)');gr.addColorStop(.15,'rgba(255,225,170,.45)');gr.addColorStop(1,'rgba(255,190,120,0)');x.fillStyle=gr;x.beginPath();x.arc(sx,sy,R,0,7);x.fill();
 x.strokeStyle='rgba(255,240,210,.35)';x.lineWidth=1.5;[[W*.3,0],[0,W*.12],[W*.1,W*.1],[W*.1,-W*.1]].forEach(([a,c])=>{x.beginPath();x.moveTo(sx-a,sy-c);x.lineTo(sx+a,sy+c);x.stroke()});
 [[.4,.03,'120,180,255',.2],[.75,.055,'255,140,80',.14],[1.15,.02,'140,255,160',.22],[1.5,.09,'200,120,255',.1],[1.8,.04,'255,220,120',.15]].forEach(([t,r,c,a])=>{
  const px=sx+(W/2-sx)*t*1.1,py=sy+(H/2-sy)*t*1.1;x.fillStyle=`rgba(${c},${a})`;x.beginPath();x.arc(px,py,W*r,0,7);x.fill()});x.restore()}

const NW=Math.max(1,Math.min(16,navigator.hardwareConcurrency||4));
const wURL=URL.createObjectURL(new Blob([$('core').textContent+`
onmessage=e=>{const d=e.data;S=d.S;Object.assign(RT,d.cfg);RT.bg=null;const{W,H,aa,b}=d,asp=W/H,ht=b.ht;
 if(d.bgd){const g=d.bgd;RT.bg=()=>{const i=(RT.py*W+RT.px)*4;return V((g[i]/255)**1.8,(g[i+1]/255)**1.8,(g[i+2]/255)**1.8)}}
 for(let y=d.k;y<H;y+=d.n){const row=new Uint8ClampedArray(W*4);
  for(let x=0;x<W;x++){let c=V(0,0,0);RT.px=x;RT.py=y;
   for(let i=0;i<aa;i++)for(let j=0;j<aa;j++){const sx=aa>1?(i+Math.random())/aa:.5,sy=aa>1?(j+Math.random())/aa:.5;
    c=add(c,shade(b.pos,norm(add(b.f,add(mul(b.r,((x+sx)/W*2-1)*ht*asp),mul(b.u,(1-(y+sy)/H*2)*ht)))),0))}
   c=mul(c,1/(aa*aa));const k=x*4;row[k]=gam(c.x);row[k+1]=gam(c.y);row[k+2]=gam(c.z);row[k+3]=255}
  postMessage({y,row},[row.buffer])}}`],{type:'text/javascript'}));
let workers=[],curRes=null,noWorkers=false;
function cancelRender(){workers.forEach(w=>w.terminate());workers=[];if(curRes){const r=curRes;curRes=null;r(false)}}
function renderFrame(W,H,aa,prog){if(noWorkers)return renderFrameST(W,H,aa,prog);
 cancelRender();rc.width=W;rc.height=H;rg.fillStyle='#000';rg.fillRect(0,0,W,H);
 const b=orbitBasis(S.cam);let bgd=null;
 if(bgImg){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(bgImg.img,0,0,W,H);bgd=x.getImageData(0,0,W,H).data}
 return new Promise(res=>{curRes=res;let done=0;
  try{for(let k=0;k<NW;k++){const w=new Worker(wURL);
   w.onmessage=e=>{rg.putImageData(new ImageData(e.data.row,W,1),0,e.data.y);done++;
    if(done%NW===0||done===H)prog(done);
    if(done===H){workers.forEach(q=>q.terminate());workers=[];curRes=null;if(S.flare)drawFlare(W,H,b);res(true)}};
   w.postMessage({S,cfg:{depth:S.depth,soft:S.light.soft,fog:true},bgd,W,H,aa,b,k,n:NW});workers.push(w)}}
  catch(err){noWorkers=true;curRes=null;workers=[];renderFrameST(W,H,aa,prog).then(res)}})}
async function doRender(quick){job++;cancelRender();openRW();const W=quick?S.resW>>1:S.resW,H=quick?S.resH>>1:S.resH,aa=quick?1:S.aa,t0=performance.now();
 const ok=await renderFrame(W,H,aa,y=>{const pc=y/H,el=(performance.now()-t0)/1000;pfill.style.width=pc*100+'%';
  rstat.textContent=`Rendering Frame ${S.frame}   Line ${y}/${H}   ${Math.floor(pc*100)}%   Elapsed ${el.toFixed(1)}s   Remaining ${Math.max(0,el/pc-el).toFixed(1)}s`});
 if(ok)rstat.textContent=`Frame ${S.frame} complete.  ${W}x${H}  ${noWorkers?1:NW} threads  ${aa*aa} ray${aa>1?'s':''}/pixel  Render time ${((performance.now()-t0)/1000).toFixed(2)}s`}
async function doRecord(W,H,aa){job++;cancelRender();const id=job;openRW();frames=[];const f0=S.frame,n=S.last-S.first+1,t0=performance.now();
 for(let f=S.first;f<=S.last;f++){setFrame(f);
  const ok=await renderFrame(W,H,aa,y=>{const pc=((f-S.first)+y/H)/n,el=(performance.now()-t0)/1000;pfill.style.width=pc*100+'%';
   rstat.textContent=`Recording  Frame ${f}  (${f-S.first+1}/${n})  ${Math.floor(pc*100)}%  Elapsed ${el.toFixed(0)}s  Remaining ${Math.max(0,el/pc-el).toFixed(0)}s`});
  if(!ok||id!==job)break;frames.push(rg.getImageData(0,0,W,H))}
 setFrame(f0);if(frames.length&&id===job){rstat.textContent=`Recorded ${frames.length} frames in ${((performance.now()-t0)/1000).toFixed(1)}s`;startPB()}}
function startPB(){rplay.style.display='';rplay.textContent='Stop';clearInterval(playI);
 playI=setInterval(()=>{rg.putImageData(frames[fIdx],0,0);rstat.textContent=`Playback  frame ${S.first+fIdx} / ${S.first+frames.length-1}`;fIdx=(fIdx+1)%frames.length},1000/S.fps)}
function stopPB(){clearInterval(playI);playI=null;rplay.textContent='Play'}
function closeRW(){job++;cancelRender();stopPB();rwin.style.display='none'}
$('rabort').onclick=()=>{job++;cancelRender();stopPB();rstat.textContent='Render aborted by user.'};
$('rclose').onclick=closeRW;
$('rplay').onclick=()=>playI?stopPB():startPB();
$('rsave').onclick=()=>{const a=document.createElement('a');a.download=`${S.name}_${String(S.frame).padStart(3,'0')}.png`;a.href=rc.toDataURL();a.click()};

// ================= keyboard =================
addEventListener('keydown',e=>{const tg=e.target.tagName;if(tg==='INPUT'||tg==='SELECT')return;
 if(e.key==='Escape'){hideMenu();if(reqs.length)reqs[reqs.length-1].close();else if(rwin.style.display==='flex')closeRW();return}
 if(reqs.length||rwin.style.display==='flex')return;
 const k=e.key.toLowerCase();
 if(e.ctrlKey&&k==='z')undo();else if(e.ctrlKey&&k==='d')cloneSel();else if(e.ctrlKey||e.metaKey)return;
 else if(k==='delete'||k==='backspace')delSel();else if(k==='t')setMouse('move');else if(k==='y')setMouse('rotate');else if(k==='h')setMouse('size');
 else if(k==='n')numeric();else if(k==='enter')keyCmd(1);else if(k==='arrowleft')setFrame(S.frame-1);else if(k==='arrowright')setFrame(S.frame+1);
 else if(k===' ')togglePlay();else if(k==='f9')doRender(false);else if(k==='f10')recordPanel();else if(k==='p')doRender(true);
 else if(k==='q'){S.shadeView=!S.shadeView;draw()}else if(k==='c')center();
 else if(k>='1'&&k<='6')setView(['xy','xz','zy','persp','light','camera'][+k-1]);
 else return;e.preventDefault()});

let UI=1,resp=false;try{resp=localStorage.getItem('lwResp')==='1'}catch(e){}
const respB=el('btn','',14,552,180,()=>{resp=!resp;try{localStorage.setItem('lwResp',resp?'1':'0')}catch(e){}fit()});
function fit(){respB.textContent=resp?'Display: Responsive':'Display: Standard';respB.classList.toggle('on',resp);
 document.body.style.overflow=resp?'hidden':'auto';document.body.style.height=resp?'100vh':'auto';
 UI=resp?Math.min((innerWidth-16)/904,(innerHeight-16)/664):1;const w=$('wrap');
 w.style.width=904*UI+'px';w.style.height=664*UI+'px';w.style.top=Math.max(0,(innerHeight-664*UI)/2)+'px';app.style.transform=`scale(${UI})`}
addEventListener('resize',fit);fit();
setRadio('v','persp');setRadio('e','object');setRadio('m','move');status(HINT);setFrame(1);
</script></body></html>
